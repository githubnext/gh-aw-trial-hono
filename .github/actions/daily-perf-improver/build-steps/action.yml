name: 'Daily Perf Improver - Build Steps'
description: 'Sets up development environment and builds the Hono project for performance engineering'
runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: '.tool-versions'

    - name: Install dependencies
      shell: bash
      run: |
        echo "=== Installing dependencies ===" | tee -a build-steps.log
        bun install --frozen-lockfile 2>&1 | tee -a build-steps.log
        echo "✓ Dependencies installed" | tee -a build-steps.log

    - name: Build project
      shell: bash
      run: |
        echo "=== Building project ===" | tee -a build-steps.log
        bun run build 2>&1 | tee -a build-steps.log
        echo "✓ Build completed" | tee -a build-steps.log

    - name: Verify build output
      shell: bash
      run: |
        echo "=== Verifying build output ===" | tee -a build-steps.log
        if [ -d "dist" ]; then
          echo "✓ dist/ directory exists" | tee -a build-steps.log
          ls -lh dist/ | tee -a build-steps.log
        else
          echo "✗ dist/ directory not found" | tee -a build-steps.log
          exit 1
        fi

    - name: Build summary
      shell: bash
      run: |
        echo "=== Build Summary ===" | tee -a build-steps.log
        echo "Build completed successfully" | tee -a build-steps.log
        echo "Environment ready for performance engineering" | tee -a build-steps.log
        echo "" | tee -a build-steps.log
        echo "Available npm scripts for performance work:" | tee -a build-steps.log
        echo "  - bun run test          # Run tests" | tee -a build-steps.log
        echo "  - bun run test:watch    # Run tests in watch mode" | tee -a build-steps.log
        echo "  - bun run build         # Build project" | tee -a build-steps.log
        echo "  - bun run watch         # Build in watch mode" | tee -a build-steps.log
        echo "  - bun run lint          # Run linter" | tee -a build-steps.log
        echo "  - bun run format        # Check formatting" | tee -a build-steps.log
        echo "" | tee -a build-steps.log
        echo "Benchmark scripts available:" | tee -a build-steps.log
        echo "  - benchmarks/routers/   # Router performance tests" | tee -a build-steps.log
        echo "  - benchmarks/jsx/       # JSX rendering benchmarks" | tee -a build-steps.log
        echo "  - benchmarks/http-server/ # HTTP server benchmarks" | tee -a build-steps.log
        echo "  - perf-measures/        # Type-check and bundle size" | tee -a build-steps.log
